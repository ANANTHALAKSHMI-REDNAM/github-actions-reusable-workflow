name: Reusable Python CI/CD

on:
  workflow_call:

    inputs:

      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"

      docker-image:
        description: "Docker image name"
        required: true
        type: string

      version:
        description: "Docker image version"
        required: true
        type: string

      deploy:
        description: "Whether to deploy the application"
        required: false
        type: boolean
        default: true

    secrets:

      POC_MESSAGE:
        required: true


jobs:

  # ==================================================
  # JOB 1: LINT
  # ==================================================

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run lint
        run: |
          ruff check .


  # ==================================================
  # JOB 2: TEST
  # ==================================================

  test:

    needs: lint

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Test reusable secret
        env:
          POC_MESSAGE: ${{ secrets.POC_MESSAGE }}
        run: |
          echo "Reusable secret received successfully"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  # ==================================================
  # JOB 3: DOCKER BUILD + GHCR
  # ==================================================

  docker:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ inputs.docker-image }}:${{ inputs.version }} .

      - name: Run Docker container
        run: |
          docker run \
            ${{ inputs.docker-image }}:${{ inputs.version }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ inputs.docker-image }}:${{ inputs.version }}


  # ==================================================
  # JOB 4: DEPLOY TO DEV
  # ==================================================

  deploy-dev:

    needs: docker

    if: ${{ inputs.deploy }}

    runs-on: ubuntu-latest

    environment: dev

    steps:

      - name: Deploy to DEV
        env:
          ENV_NAME: ${{ vars.ENV_NAME }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          VERSION: ${{ inputs.version }}
          DOCKER_IMAGE: ${{ inputs.docker-image }}

        run: |
          echo "======================================"
          echo "DEV DEPLOYMENT"
          echo "======================================"
          echo "Environment: ${ENV_NAME}"
          echo "Deployment URL: ${DEPLOY_URL}"
          echo "Docker Image: ${DOCKER_IMAGE}:${VERSION}"
          echo "Version: ${VERSION}"
          echo "Application deployed successfully to DEV"


  # ==================================================
  # JOB 5: DEPLOY TO PROD
  # ==================================================

  deploy-prod:

    needs: deploy-dev

    if: ${{ inputs.deploy }}

    runs-on: ubuntu-latest

    environment: prod

    steps:

      - name: Deploy to PROD
        env:
          ENV_NAME: ${{ vars.ENV_NAME }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          VERSION: ${{ inputs.version }}
          DOCKER_IMAGE: ${{ inputs.docker-image }}

        run: |
          echo "======================================"
          echo "PROD DEPLOYMENT"
          echo "======================================"
          echo "Environment: ${ENV_NAME}"
          echo "Deployment URL: ${DEPLOY_URL}"
          echo "Docker Image: ${DOCKER_IMAGE}:${VERSION}"
          echo "Version: ${VERSION}"
          echo "Deployment token received"

          # Real deployment command goes here
          echo "Application deployed successfully to PROD"