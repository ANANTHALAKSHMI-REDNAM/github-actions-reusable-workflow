name: Reusable Python CI

on:
  workflow_call:

    inputs:

      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"

      docker-image:
        description: "Docker image name"
        required: true
        type: string


      version:
        description: "Docker image version"
        required: false
        type: string
        default: "latest"


    secrets:

      POC_MESSAGE:
        required: true


jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run lint
        run: |
          ruff check .


  test:

    needs: lint

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Test reusable secret
        env:
          POC_MESSAGE: ${{ secrets.POC_MESSAGE }}
        run: |
          echo "Secret was received by reusable workflow"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest


  docker:

    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ inputs.docker-image }}:${{ inputs.version }}  .

      - name: Run Docker container
        run: |
          docker run ${{ inputs.docker-image }}:${{ inputs.version }}

      - name: Push Docker image
        run: |
          docker push ${{ inputs.docker-image }}:${{ inputs.version }}